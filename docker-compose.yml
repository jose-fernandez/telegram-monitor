services:
  telegram-monitor:
    image: ghcr.io/jose-fernandez/telegram-monitor:latest
    build: .
    restart: unless-stopped
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      # Time zone for log timestamps; set TZ in .env, defaults to UTC
      - TZ=${TZ:-UTC}
    volumes:
      # Holds sesion_monitor.session and config.json
      - ./data:/app/data
